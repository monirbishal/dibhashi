<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <link href="{{ url_for('static', filename='dist/output.css') }}" rel="stylesheet">

    <title>{{ title or "Dibhashi — English to Bangla Video Dubbing with AI" }}</title>
    <meta name="description" content="Dibhashi is an AI‑powered platform that dubs English videos into natural‑sounding Bangla, preserving timing, emotion, and clarity." />
    <meta name="keywords" content="English to Bangla, AI dubbing, Whisper ASR, Neural MT, Bangla TTS, video translation" />
    <meta name="author" content="Monir Hossain" />
    <meta name="robots" content="index, follow" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16x16.png') }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}" />
    <link rel="manifest" href="{{ url_for('static', filename='images/site.webmanifest') }}" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/android-chrome-192x192.png') }}" />
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/android-chrome-512x512.png') }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dibhashi — English to Bangla Video Dubbing with AI" />
    <meta property="og:description" content="Transform English videos into natural‑sounding Bangla with our AI‑powered pipeline (ASR → NMT → TTS → FFmpeg)." />
    <meta property="og:url" content="{{ url_for('index', _external=True) }}" />
    <meta property="og:image" content="{{ url_for('static', filename='images/og-image-1200x630.png', _external=True) }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Diagram of Dibhashi’s ASR → Translation → TTS → Video pipeline" />

<body class="flex flex-col min-h-[calc(100vh-64px)] bg-gray-900">

    {% include 'header.html' %}
    <main class="mt-[64px] flex-grow overflow-auto">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-50/10 text-center">
        <div class="py-4 container mx-auto flex gap-4 items-cenbter justify-center">
             <p class="text-sm font-semibold text-gray-300">
            © Dibhashi
            </p>
            <address class="not-italic text-sm text-gray-300">
      Developed by <a href="https://monirbishal.com" class="text-indigo-400 font-medium">Monir Hossain</a>
    </address>
        </div>
    </footer>
    <script>
        document.getElementById('translate-btn')?.addEventListener('click', function () {
            document.getElementById('btn-text').classList.add('invisible');
            document.getElementById('btn-spinner').classList.remove('hidden');
        });

        function copyTextFromDiv(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text)
            .then(() => {
                alert("Text copied to clipboard!");
            })
            .catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }
    </script>

</body>

</html>
